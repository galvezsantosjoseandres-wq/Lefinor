<!doctype html>
<html lang="es">
{{> head}}
<body class="bg-lefinor-azul/[0.03] text-lefinor-azul font-sans antialiased min-h-screen flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-sm mx-auto">
    <div class="bg-white rounded-2xl shadow-lg border border-lefinor-gris/10 overflow-hidden">
      <div class="relative bg-lefinor-azul pt-6 pb-20">
        <div class="flex justify-center">
          <img src="/img/lefinor-logo-principal.svg" alt="{{site.siteName}}" class="h-16 w-auto" />
        </div>
        <div class="absolute top-4 right-4 flex gap-2">
          <a
            href="{{site.domain}}"
            target="_blank"
            rel="noopener"
            aria-label="Sitio web de {{site.siteName}}"
            class="w-8 h-8 rounded-full bg-white/15 hover:bg-white/25 flex items-center justify-center text-white transition-colors"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0 0c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3s4.5 4.03 4.5 9-2.015 9-4.5 9ZM3.5 9h17M3.5 15h17"
              />
            </svg>
          </a>
          <a
            href="{{site.instagramUrl}}"
            target="_blank"
            rel="noopener"
            aria-label="Instagram de {{site.siteName}}"
            class="w-8 h-8 rounded-full bg-white/15 hover:bg-white/25 flex items-center justify-center text-white transition-colors"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-4 h-4" fill="currentColor">
              <path
                d="M12 2.16c3.2 0 3.58.01 4.85.07 3.25.15 4.77 1.69 4.92 4.92.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.15 3.23-1.66 4.77-4.92 4.92-1.27.06-1.64.07-4.85.07s-3.58-.01-4.85-.07c-3.26-.15-4.77-1.7-4.92-4.92-.06-1.27-.07-1.65-.07-4.85s.02-3.58.07-4.85c.15-3.23 1.67-4.77 4.92-4.92 1.27-.06 1.65-.07 4.85-.07zM12 0C8.74 0 8.33.01 7.05.07c-4.35.2-6.78 2.62-6.98 6.98C.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.2 4.36 2.62 6.78 6.98 6.98C8.33 23.99 8.74 24 12 24s3.67-.01 4.95-.07c4.35-.2 6.78-2.62 6.98-6.98.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.2-4.35-2.62-6.78-6.98-6.98C15.67.01 15.26 0 12 0zm0 5.84A6.16 6.16 0 1 0 12 18.16 6.16 6.16 0 0 0 12 5.84zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.41-10.85a1.44 1.44 0 1 1-2.88 0 1.44 1.44 0 0 1 2.88 0z"
              />
            </svg>
          </a>
        </div>
      </div>

      <div class="relative p-6 text-center -mt-14">
        <img
          src="{{profesional.foto}}"
          alt="{{profesional.fotoAlt}}"
          class="w-28 h-28 rounded-full object-cover mx-auto border-4 border-white shadow-md"
        />
        <h1 class="text-xl font-bold text-lefinor-azul mt-4">{{profesional.honorifico}} {{profesional.nombre}}</h1>
        <p class="text-lefinor-dorado font-semibold text-sm">{{profesional.cargo}}</p>
        <p class="text-xs text-lefinor-gris mt-1">{{profesional.area}} · {{site.siteName}}</p>

        <div class="mt-6 grid grid-cols-1 gap-3">
          <a
            href="https://wa.me/{{whatsappNumeroTarjeta}}?text={{{mensajeWhatsappTarjetaCodificado}}}"
            target="_blank"
            rel="noopener"
            class="flex items-center justify-center gap-2 bg-[#25D366] text-white font-semibold py-2.5 rounded-md hover:opacity-90"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-5 h-5" fill="currentColor">
              <path
                d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2z"
              />
            </svg>
            WhatsApp
          </a>
          <a
            href="{{site.mapsUrl}}"
            target="_blank"
            rel="noopener"
            class="flex items-center justify-center gap-2 bg-white border border-lefinor-azul/20 text-lefinor-azul font-semibold py-2.5 rounded-md hover:bg-lefinor-azul/5"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"
              />
            </svg>
            Cómo llegar
          </a>
          <a
            href="{{profesional.vcardArchivo}}"
            download
            class="flex items-center justify-center gap-2 bg-lefinor-dorado text-lefinor-azul font-semibold py-2.5 rounded-md hover:opacity-90"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 9.375 21c-2.331 0-4.512-.645-6.374-1.766Z"
              />
            </svg>
            Guardar contacto
          </a>
        </div>

        <div class="mt-8 flex flex-col items-center">
          <div
            class="w-[140px] h-[140px] rounded-md border border-lefinor-gris/15 overflow-hidden [&>svg]:block [&>svg]:w-full [&>svg]:h-full"
            role="img"
            aria-label="Código QR de la tarjeta de {{profesional.nombre}}"
          >
            {{{qrSvg}}}
          </div>
          <p class="text-xs text-lefinor-gris mt-2">Escanea para compartir esta tarjeta</p>
          <p class="text-[11px] text-lefinor-gris/70 mt-1 text-center max-w-[220px]">
            📲 Guárdala en tu pantalla de inicio: compartir → Añadir a pantalla de inicio
          </p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
