<!doctype html>
<html lang="es">
{{> head}}
<body class="bg-lefinor-azul text-white font-sans antialiased min-h-screen flex items-center justify-center px-4">
  <div class="max-w-lg mx-auto text-center py-16">
    <img src="/img/lefinor-isotipo.svg" alt="{{site.siteName}}" class="h-16 w-auto mx-auto mb-6" />
    <p class="text-7xl md:text-8xl font-extrabold text-lefinor-dorado leading-none">404</p>
    <h1 class="text-2xl md:text-3xl font-bold mt-6">Esta página no existe o fue movida</h1>
    <p class="mt-4 text-white/70 leading-relaxed">
      Puede que el enlace esté desactualizado, o que el contenido que buscabas ya no esté disponible. Te invitamos a
      explorar el resto del sitio.
    </p>
    <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
      <a
        href="/"
        class="inline-flex bg-lefinor-dorado text-lefinor-azul font-semibold px-6 py-3 rounded-md hover:opacity-90"
        >Volver al Inicio</a
      >
      <a
        href="/publicaciones.html"
        class="inline-flex border border-white text-white font-semibold px-6 py-3 rounded-md hover:bg-white/10"
        >Ver Publicaciones</a
      >
    </div>
  </div>
</body>
</html>
